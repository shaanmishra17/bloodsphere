# ==============================================================================
# HEMO LINK - Spring Boot & MySQL Configuration
# Department of IT Engineering - Theem College of Engineering, Boisar
# ==============================================================================

# Server Port
server.port=8080

# Spring Application Name
spring.application.name=hemolink-backend

# MySQL Database DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hemolink_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration Settings (Allows frontend integration from port 8000/5500)
hemolink.cors.allowed-origins=http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://localhost:5500
